apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-root-redirect
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    nginx.ingress.kubernetes.io/permanent-redirect: /grafana
spec:
  ingressClassName: nginx
  rules:
    - host: platform.local
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
