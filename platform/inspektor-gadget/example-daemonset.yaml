apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gadget-demo
  namespace: default
  labels:
    app: gadget-demo
spec:
  selector:
    matchLabels:
      app: gadget-demo
  template:
    metadata:
      labels:
        app: gadget-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - while true; do echo "gadget-demo $(date)"; sleep 30; done
      restartPolicy: Always
