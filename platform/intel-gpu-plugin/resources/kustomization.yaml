apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/gpu_plugin/base?ref=v0.37.1&timeout=120s
  - node-feature-rule.yaml
images:
  - name: intel/intel-gpu-plugin
    newTag: "0.37.1"
    digest: sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33
patches:
  - path: daemonset.yaml
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: intel-gpu-plugin
    patch: |-
      - op: add
        path: /metadata/namespace
        value: intel-device-plugins
