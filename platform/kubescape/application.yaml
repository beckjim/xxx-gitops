apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescape
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-admins
  source:
    repoURL: https://kubescape.github.io/helm-charts
    chart: kubescape-operator
    targetRevision: 1.40.3
    helm:
      releaseName: kubescape
      parameters:
        - name: clusterName
          value: "cluster"
        - name: ksNamespace
          value: "kubescape"
  destination:
    server: https://kubernetes.default.svc
    namespace: kubescape
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
