apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-admins
  namespace: argocd
spec:
  description: Platform-admin managed applications and cluster components
  sourceRepos:
    - https://github.com/beckjim/xxx-gitops
    - https://github.com/headlamp-k8s/headlamp.git
    - https://charts.jetstack.io
    - https://grafana.github.io/helm-charts
    - https://inspektor-gadget.github.io/charts/
    - https://kubescape.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://metallb.github.io/metallb
    - https://github.com/nginx/nginx-gateway-fabric
    - oci://ghcr.io/nginx/charts
    - https://kyverno.github.io/kyverno/
    - https://kyverno.github.io/policy-reporter
    - https://charts.external-secrets.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://inspektor-gadget.github.io/charts/
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: admins
      description: Full project control for platform admins
      policies:
        - p, proj:platform-admins:admins, applications, *, platform-admins/*, allow
      groups:
        - platform-admins
