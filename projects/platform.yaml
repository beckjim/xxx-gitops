apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-admins
  namespace: argocd
spec:
  description: Platform-admin managed applications and cluster components
  sourceRepos:
    - https://github.com/beckjim/xxx-gitops
    - https://charts.jetstack.io
    - https://kubescape.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kubernetes.github.io/ingress-nginx
    - https://kyverno.github.io/kyverno/
    - https://charts.external-secrets.io
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: admins
      description: Full project control for platform admins
      policies:
        - p, proj:platform-admins:admins, applications, *, platform-admins/*, allow
      groups:
        - platform-admins
