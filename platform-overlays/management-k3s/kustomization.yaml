apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform/base
  - metallb-config.yaml
components:
  - ../../platform/profiles/k3s-lan
patches:
  - path: cluster.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: kubescape
    patch: |-
      - op: replace
        path: /spec/source/helm/parameters/0/value
        value: management-k3s
