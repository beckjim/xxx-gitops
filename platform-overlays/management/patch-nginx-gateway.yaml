apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway
  namespace: argocd
spec:
  source:
    helm:
      releaseName: nginx-gateway
      parameters:
        - name: nginxGateway.gatewayClassName
          value: platform-nginx
        - name: nginx.service.type
          value: "LoadBalancer"
