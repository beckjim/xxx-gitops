apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../management
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: platform
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform-overlays/management-k3s
